name: Build APK

# Builds an installable debug APK (signed with the standard debug key) and runs
# the theme-designer unit tests on every push, pull request, or manual run.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04   # image ships with the Android SDK
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Use the SDK preinstalled on the runner (the setup-android action failed here)
      - name: Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM=$(ls "$SDK"/cmdline-tools/latest/bin/sdkmanager "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "Using SDK at $SDK (sdkmanager: $SM)"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (designer engine)
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: OpenLauncher-ThemeStudio-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
